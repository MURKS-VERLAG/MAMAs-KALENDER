<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#ffffff" />
<title>Für Mama ❤️</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <section id="intro" class="screen active">
    <svg class="heart-draw" viewBox="0 0 120 110" aria-label="Herz">
      <path d="M60 99 C52 88 13 65 13 35 C13 15 36 7 49 19 C55 24 58 29 60 34 C62 29 65 24 71 19 C84 7 107 15 107 35 C107 65 68 88 60 99Z" />
    </svg>
  </section>

  <section id="home" class="screen">
    <div class="home-wrap">
      <h1>Für Mama</h1>
      <button class="big-card" id="calendarBtn" aria-label="Kalender öffnen">
        <span class="icon calendar-icon">21</span><span>Kalender</span>
      </button>
      <button class="big-card" id="albumBtn" aria-label="Fotoalbum öffnen">
        <span class="album-icon">♡</span><span>Fotoalbum</span>
      </button>
      <button class="big-card" id="giftBtn" aria-label="Geschenk öffnen">
        <span class="gift-icon">🎁</span><span>Geschenk</span>
      </button>
    </div>
  </section>

  <section id="calendar" class="screen">
    <div id="calendarPages" class="pages"></div>
    <div id="pageDots" class="dots"></div>
    <button class="home-btn" data-home aria-label="Startseite">⌂</button>
  </section>

  <section id="album" class="screen">
    <div class="album-message">
      <div class="album-heart">♡</div>
      <p id="typewriterText"></p>
    </div>
    <button class="home-btn" data-home aria-label="Startseite">⌂</button>
  </section>

  <section id="gift" class="screen">
    <div id="giftPages" class="pages gift-pages"></div>
    <div id="giftDots" class="dots"></div>
    <button class="home-btn" data-home aria-label="Startseite">⌂</button>
  </section>

  <button id="soundBtn" class="sound-btn hidden" aria-label="Musik stummschalten">🔊</button>
  <audio id="music" src="top-of-the-world.mp3" loop preload="auto"></audio>
  <div id="heartCurtain" aria-hidden="true"></div>
</div>
<script src="app.js"></script>
</body>
</html>
